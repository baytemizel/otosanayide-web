# /etc/nginx/sites-available/otosanayide.com.coming-soon
#
# "Pek yakında" mode: the Nuxt app is not used. Every path on www.otosanayide.com answers
# 503 + Retry-After with the static page in /var/www/otosanayide-coming-soon
# (deploy/coming-soon/), so search engines treat the closure as temporary.
# The redirects (http and apex -> www) are the same as otosanayide.com.conf.
#
# Switch on:  ln -sfn ../sites-available/otosanayide.com.coming-soon
#             /etc/nginx/sites-enabled/otosanayide.com; nginx -t && systemctl reload nginx;
#             systemctl disable --now otosanayide-web
# Switch off: ln -sfn ../sites-available/otosanayide.com /etc/nginx/sites-enabled/otosanayide.com;
#             systemctl enable --now otosanayide-web; nginx -t && systemctl reload nginx
#
# TLS: Cloudflare Origin certificate (Cloudflare SSL mode Full (strict)).

# http -> https (both names)
server {
    listen 80;
    listen [::]:80;
    server_name otosanayide.com www.otosanayide.com;

    # certbot renewal (webroot or nginx plugin both work with this)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.otosanayide.com$request_uri;
    }
}

# https apex -> https www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otosanayide.com;

    ssl_certificate     /etc/ssl/cloudflare/otosanayide.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/otosanayide.com.key;

    # Cloudflare "Always Use HTTPS" sends the ACME check here over https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.otosanayide.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.otosanayide.com;

    ssl_certificate     /etc/ssl/cloudflare/otosanayide.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/otosanayide.com.key;

    root /var/www/otosanayide-coming-soon;

    access_log /var/log/nginx/otosanayide.com.access.log;
    error_log  /var/log/nginx/otosanayide.com.error.log;

    server_tokens off;

    # add_header is set per location: one inside a location drops any server-level ones.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Page assets (CSS, fonts, logo): 200, cached for a day.
    location ^~ /_yakinda/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # Every other path, any method: 503 with the static page as the body.
    # A direct hit on /index.html or a missing asset also gets the page with 503.
    error_page 503 /index.html;
    error_page 404 =503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After "86400" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        return 503;
    }
}
