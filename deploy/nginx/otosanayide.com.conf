# /etc/nginx/sites-available/otosanayide.com
#
# Nuxt 4 SSR (nitro node-server). nginx terminates TLS, serves hashed /_nuxt/ files from
# disk and proxies everything else to the Node process on 127.0.0.1:3000
# (see deploy/systemd/otosanayide-web.service).
#
# Canonical address: https://www.otosanayide.com. otosanayide.com and plain http redirect there.
# The app already sends CSP, X-Frame-Options, nosniff, Referrer-Policy and Permissions-Policy
# on rendered pages; they are not repeated here to avoid duplicate headers.
#
# TLS: Cloudflare Origin certificate (Cloudflare SSL mode Full (strict)); the site only works
# behind the Cloudflare proxy.

upstream otosanayide_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# http -> https (both names)
server {
    listen 80;
    listen [::]:80;
    server_name otosanayide.com www.otosanayide.com;

    # certbot renewal (webroot or nginx plugin both work with this)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.otosanayide.com$request_uri;
    }
}

# https apex -> https www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otosanayide.com;

    ssl_certificate     /etc/ssl/cloudflare/otosanayide.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/otosanayide.com.key;

    # Cloudflare "Always Use HTTPS" sends the ACME check here over https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.otosanayide.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.otosanayide.com;

    ssl_certificate     /etc/ssl/cloudflare/otosanayide.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/otosanayide.com.key;

    root /var/www/otosanayide.com/.output/public;

    access_log /var/log/nginx/otosanayide.com.access.log;
    error_log  /var/log/nginx/otosanayide.com.error.log;

    client_max_body_size 10m;
    server_tokens off;

    # Note: any add_header inside a location drops these server-level ones, so locations
    # that add headers repeat HSTS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript application/manifest+json image/svg+xml;

    # certbot webroot check (reaches https when Cloudflare forces https).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # App manifest (latest.json, meta/*.json): let Nitro send its own cache headers.
    location ^~ /_nuxt/builds/ {
        proxy_pass http://otosanayide_web;
        include /etc/nginx/snippets/otosanayide-proxy.conf;
    }

    # Hashed build assets: served from disk, cached for a year. A missing file is a 404,
    # not an SSR page.
    location ^~ /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # Pages, sitemap.xml, robots.txt, push-worker.js and other public/ files: Nuxt.
    location / {
        proxy_pass http://otosanayide_web;
        include /etc/nginx/snippets/otosanayide-proxy.conf;
    }
}
